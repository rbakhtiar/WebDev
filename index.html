
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b0a">
  <meta name="description" content="WebDev Browser Engine — build and preview websites in your browser.">
  <title>WebDev — Browser Engine</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

  <header>
    <div class="brand">Web<span>Dev</span></div>
    <div class="engine-label">BROWSER ENGINE / 01</div>
    <div class="spacer"></div>
    <div class="status" id="status">● READY</div>
    <button id="clearBtn">Clear Console</button>
    <button class="run" id="runBtn">▶ Run</button>
  </header>

  <div class="toolbar">
    <button id="resetBtn" title="Reset starter project">↶</button>
    <button id="refreshBtn" title="Run code again">↻</button>

    <div class="address">
      <span>◈</span>
      <input id="address" value="webdev://local-preview" readonly aria-label="Preview address">
    </div>

    <button id="exportBtn">Export HTML</button>
  </div>

  <main class="workspace">

    <section class="left">
      <div class="section-head">
        <div class="dot"></div>
        <span>EDITOR</span>
        <div class="spacer"></div>
        <span id="fileLabel" style="color:var(--gold)">index.html</span>
      </div>

      <div class="section-head" style="height:42px">
        <div class="tabs">
          <button class="tab active" data-lang="html">HTML</button>
          <button class="tab" data-lang="css">CSS</button>
          <button class="tab" data-lang="js">JavaScript</button>
        </div>
      </div>

      <div class="editor-wrap">
        <div id="lineNumbers" aria-hidden="true">1</div>
        <textarea
          id="editor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          aria-label="Code editor"
        ></textarea>
      </div>

      <div class="editor-footer">
        <span id="cursorInfo">Ln 1, Col 1</span>
        <span id="languageInfo">HTML · UTF-8</span>
      </div>
    </section>

    <section class="right">
      <div class="section-head">
        <div class="dot"></div>
        <span>LIVE PREVIEW</span>

        <div class="preview-tools">
          <button data-size="desktop">Desktop</button>
          <button data-size="tablet">Tablet</button>
          <button data-size="mobile">Mobile</button>
        </div>
      </div>

      <div class="preview-area">
        <div class="device desktop" id="device">
          <div class="device-bar">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <span style="margin-left:6px">local preview</span>
          </div>

          <iframe
            id="preview"
            title="WebDev website preview"
            sandbox="allow-scripts allow-forms allow-modals"
          ></iframe>
        </div>
      </div>

      <div class="console">
        <div class="console-head">
          <span>ENGINE CONSOLE</span>
          <button id="clearOutputBtn" style="padding:4px 8px;font-size:10px">
            Clear output
          </button>
        </div>

        <div id="consoleOutput" aria-live="polite">
          <div class="log">WebDev Browser Engine initialized.</div>
          <div class="log">Waiting for your code.</div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span>WEBDEV ENGINE <strong>v1.1.0</strong></span>
    <span>HTML · CSS · JAVASCRIPT</span>
    <span id="saveStatus">LOCAL WORKSPACE</span>
  </footer>

</div>

<script>
"use strict";

const $ = selector => document.querySelector(selector);

const editor = $("#editor");
const preview = $("#preview");
const output = $("#consoleOutput");
const status = $("#status");

const STORAGE_KEY = "webdev-engine-project-v1";

const defaults = {
  html: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebDev Project</title>
</head>
<body>
  <main class="card">
    <div class="eyebrow">WEBDEV ENGINE</div>
    <h1>Build something <span>remarkable.</span></h1>
    <p>Your code. Your ideas. Your website.</p>
    <button id="hello">Test JavaScript</button>
    <div id="result"></div>
  </main>
</body>
</html>`,

  css: `* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #08130e;
  color: #edf7ef;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 600px;
  padding: 48px 32px;
  text-align: center;
}

.eyebrow {
  color: #bba878;
  font-size: 11px;
  letter-spacing: 4px;
}

h1 {
  font-size: clamp(32px, 7vw, 58px);
  line-height: 1.1;
  letter-spacing: -2px;
}

h1 span {
  color: #38d996;
}

p {
  color: #a1b4a7;
  line-height: 1.8;
}

button {
  margin-top: 18px;
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  background: #38d996;
  color: #07110d;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 18px;
  color: #d8bd83;
}`,

  js: `console.log("WebDev Engine is running.");

document.getElementById("hello").addEventListener("click", () => {
  document.getElementById("result").textContent =
    "JavaScript works!";
  console.log("Button clicked successfully.");
});`
};

let files = { ...defaults };
let activeLang = "html";
let debounceTimer;
let executionTimer;
let runId = 0;

function addLog(message, type = "log") {
  const line = document.createElement("div");
  line.className = type;
  line.textContent = String(message);

  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}

function clearConsole() {
  output.replaceChildren();
}

function updateLineNumbers() {
  const count = editor.value.split("\n").length;

  $("#lineNumbers").textContent = Array.from(
    { length: count },
    (_, index) => index + 1
  ).join("\n");

  $("#lineNumbers").scrollTop = editor.scrollTop;
}

function updateCursor() {
  const before = editor.value.slice(0, editor.selectionStart);
  const lines = before.split("\n");

  $("#cursorInfo").textContent =
    `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
}

function saveCurrentFile() {
  files[activeLang] = editor.value;
}

function switchTab(lang) {
  saveCurrentFile();
  activeLang = lang;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.lang === lang);
  });

  editor.value = files[lang];

  $("#fileLabel").textContent = {
    html: "index.html",
    css: "style.css",
    js: "script.js"
  }[lang];

  $("#languageInfo").textContent =
    lang.toUpperCase() + " · UTF-8";

  updateLineNumbers();
  updateCursor();
  editor.focus();
}

function persistProject() {
  saveCurrentFile();

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
    $("#saveStatus").textContent = "SAVED LOCALLY";
  } catch (error) {
    $("#saveStatus").textContent = "SAVE UNAVAILABLE";
  }
}

function restoreProject() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (!saved || typeof saved !== "object") return;

    for (const lang of ["html", "css", "js"]) {
      if (typeof saved[lang] === "string") {
        files[lang] = saved[lang];
      }
    }
  } catch (error) {
    // Invalid saved data: use the starter project.
  }
}

function buildDocument(id) {
  saveCurrentFile();

  const doc = new DOMParser().parseFromString(
    files.html,
    "text/html"
  );

  const stylesheet = doc.createElement("style");
  stylesheet.textContent = files.css;
  doc.head.appendChild(stylesheet);

  // Report logs from the isolated preview to the parent console.
  const bridge = doc.createElement("script");

  bridge.textContent = `
    (() => {
      const runId = ${JSON.stringify(id)};

      function report(type, args) {
        const message = args.map(value => {
          try {
            if (value instanceof Error) return value.message;
            if (typeof value === "string") return value;
            return JSON.stringify(value) ?? String(value);
          } catch {
            return String(value);
          }
        }).join(" ");

        parent.postMessage({
          source: "webdev-engine",
          runId,
          type,
          message
        }, "*");
      }

      for (const method of ["log", "info", "warn", "error"]) {
        const original = console[method].bind(console);

        console[method] = (...args) => {
          original(...args);
          report(
            method === "warn" ? "warn" :
            method === "error" ? "error" : "log",
            args
          );
        };
      }

      addEventListener("error", event => {
        report("error", [
          event.message || "JavaScript runtime error",
          event.lineno ? "Line " + event.lineno : ""
        ]);
      });

      addEventListener("unhandledrejection", event => {
        report("error", ["Unhandled promise rejection", event.reason]);
      });
    })();
  `;

  doc.head.prepend(bridge);

  // Run user code after the HTML document has been parsed.
  const userScript = doc.createElement("script");
  userScript.textContent = files.js;
  doc.body.appendChild(userScript);

  return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}

function runCode() {
  clearTimeout(debounceTimer);
  saveCurrentFile();
  persistProject();

  const thisRun = ++runId;

  clearConsole();
  status.textContent = "● RUNNING";
  status.style.color = "var(--gold)";

  try {
    const html = buildDocument(thisRun);

    preview.srcdoc = html;
    $("#address").value = "webdev://local-preview";

    addLog("Building preview document...");
    addLog("Submitting HTML, CSS and JavaScript to the browser renderer.");
  } catch (error) {
    addLog(error.message, "error");
    status.textContent = "● ERROR";
    status.style.color = "var(--red)";
    return;
  }

  clearTimeout(executionTimer);

  executionTimer = setTimeout(() => {
    if (thisRun !== runId) return;

    status.textContent = "● READY";
    status.style.color = "var(--green)";
  }, 1000);
}

function resetProject() {
  const confirmed = confirm(
    "Reset HTML, CSS and JavaScript to the starter project?"
  );

  if (!confirmed) return;

  files = { ...defaults };
  switchTab("html");
  persistProject();
  runCode();
}

function exportProject() {
  saveCurrentFile();

  // Export the combined website, including its CSS and JavaScript.
  const html = buildDocument(runId + 1);
  const blob = new Blob(
    [html],
    { type: "text/html;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "webdev-project.html";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  addLog("Exported webdev-project.html");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => switchTab(tab.dataset.lang));
});

document.querySelectorAll("[data-size]").forEach(button => {
  button.addEventListener("click", () => {
    $("#device").className = "device " + button.dataset.size;
  });
});

editor.addEventListener("input", () => {
  saveCurrentFile();
  updateLineNumbers();
  updateCursor();
  persistProject();

  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runCode, 900);
});

editor.addEventListener("scroll", updateLineNumbers);
editor.addEventListener("click", updateCursor);
editor.addEventListener("keyup", updateCursor);

editor.addEventListener("keydown", event => {
  if (event.key === "Tab") {
    event.preventDefault();

    editor.setRangeText(
      "  ",
      editor.selectionStart,
      editor.selectionEnd,
      "end"
    );

    editor.dispatchEvent(new Event("input"));
  }

  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    runCode();
  }
});

$("#runBtn").addEventListener("click", runCode);
$("#refreshBtn").addEventListener("click", runCode);
$("#resetBtn").addEventListener("click", resetProject);
$("#clearBtn").addEventListener("click", clearConsole);
$("#clearOutputBtn").addEventListener("click", clearConsole);
$("#exportBtn").addEventListener("click", exportProject);

preview.addEventListener("load", () => {
  status.textContent = "● READY";
  status.style.color = "var(--green)";
});

window.addEventListener("message", event => {
  if (event.source !== preview.contentWindow) return;

  const data = event.data;

  if (!data || data.source !== "webdev-engine") return;
  if (data.runId !== runId) return;

  const types = {
    log: "log",
    info: "log",
    warn: "warn",
    error: "error"
  };

  if (!types[data.type]) return;

  addLog(data.message, types[data.type]);
});

restoreProject();
switchTab("html");
runCode();
</script>
</body>
</html>

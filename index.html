
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110e">
<title>WebDev Engine</title>

<style>
:root {
  --bg: #070b0a;
  --panel: #0d1512;
  --panel2: #111c17;
  --border: #24352c;
  --green: #38d996;
  --gold: #d8bd83;
  --text: #e9f0eb;
  --muted: #829187;
  --red: #ff7272;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 57px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 17px;
  background: #0a100d;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -1px;
}

.brand span { color: var(--green); }

.engine-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--muted);
}

.spacer { flex: 1; }

.status {
  color: var(--green);
  font-size: 11px;
}

button {
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 12px;
}

button:hover { border-color: var(--green); }

.run {
  background: var(--green);
  color: #07110d;
  border-color: var(--green);
  font-weight: 800;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.address {
  display: flex;
  flex: 1;
  min-width: 0;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 0 11px;
  height: 35px;
  border-radius: 7px;
}

.address span { color: var(--green); }

.address input {
  color: var(--muted);
  background: transparent;
  border: 0;
  outline: none;
  width: 100%;
  min-width: 0;
  font-size: 12px;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  flex: 1;
  min-height: 0;
}

.left, .right {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.left { border-right: 1px solid var(--border); }

.section-head {
  height: 43px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 13px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.tabs {
  display: flex;
  gap: 3px;
  overflow-x: auto;
}

.tab {
  border: 0;
  border-radius: 5px;
  padding: 7px 10px;
  color: var(--muted);
  background: transparent;
  white-space: nowrap;
}

.tab.active {
  background: #183125;
  color: var(--green);
}

.editor-wrap {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
  background: #090e0c;
}

#lineNumbers {
  width: 42px;
  flex-shrink: 0;
  padding: 15px 9px;
  text-align: right;
  color: #506258;
  background: #090e0c;
  border-right: 1px solid #1b2921;
  font: 12px/21px monospace;
  white-space: pre;
  overflow: hidden;
  user-select: none;
}

#editor {
  flex: 1;
  min-width: 0;
  min-height: 0;
  resize: none;
  outline: none;
  border: 0;
  padding: 15px;
  background: transparent;
  color: #cce8d5;
  caret-color: var(--green);
  font: 12px/21px monospace;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
}

.editor-footer {
  height: 29px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--panel);
  color: var(--muted);
  font: 10px monospace;
  border-top: 1px solid var(--border);
}

.preview-tools {
  display: flex;
  gap: 5px;
  margin-left: auto;
}

.preview-tools button {
  padding: 5px 8px;
  font-size: 10px;
}

.preview-area {
  flex: 1;
  min-height: 0;
  padding: 12px;
  background:
    radial-gradient(ellipse at top, #17271e 0%, #090d0b 65%);
  overflow: auto;
}

.device {
  height: 100%;
  min-height: 200px;
  margin: auto;
  background: white;
  border: 1px solid #35473c;
  border-radius: 5px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: width .2s;
}

.device.desktop { width: 100%; }
.device.tablet { width: min(768px, 100%); }
.device.mobile { width: min(375px, 100%); }

.device-bar {
  height: 27px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 9px;
  color: #8c9c91;
  background: #111a15;
  font: 10px monospace;
}

.device-bar .circle {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #35493b;
}

#preview {
  border: 0;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: white;
}

.console {
  height: 135px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: #090e0c;
}

.console-head {
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  color: var(--muted);
  font-size: 11px;
}

#consoleOutput {
  overflow: auto;
  padding: 0 12px 10px;
  font: 11px/19px monospace;
}

.log { color: #b7c9bd; }
.error { color: var(--red); }
.warn { color: var(--gold); }

footer {
  height: 27px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: #101914;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 10px;
}

footer strong {
  color: var(--green);
  font-weight: normal;
}

@media (max-width: 650px) {
  body { overflow: auto; }
  .app { min-height: 100vh; height: auto; }
  header { gap: 9px; padding: 0 10px; }
  .engine-label { display: none; }
  .toolbar { padding: 8px; gap: 5px; }
  .toolbar button { padding: 8px; font-size: 11px; }
  .workspace {
    display: flex;
    flex-direction: column;
    min-height: 1000px;
  }
  .left { height: 480px; border-right: 0; }
  .right { height: 520px; }
  .preview-area { min-height: 300px; }
  .console { height: 110px; }
  footer { margin-top: auto; }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="brand">Web<span>Dev</span></div>
    <div class="engine-label">BROWSER ENGINE / 01</div>
    <div class="spacer"></div>
    <div class="status" id="status">● READY</div>
    <button id="clearBtn">Clear</button>
    <button class="run" id="runBtn">▶ Run</button>
  </header>

  <div class="toolbar">
    <button id="backBtn" title="Reset preview">↶</button>
    <button id="refreshBtn" title="Run code again">↻</button>
    <div class="address">
      <span>◈</span>
      <input id="address" value="webdev://local-preview" readonly>
    </div>
    <button id="exportBtn">Export</button>
  </div>

  <main class="workspace">

    <section class="left">
      <div class="section-head">
        <div class="dot"></div>
        <span>EDITOR</span>
        <div class="spacer"></div>
        <span id="fileLabel" style="color:var(--gold)">index.html</span>
      </div>

      <div class="section-head" style="height:42px">
        <div class="tabs">
          <button class="tab active" data-lang="html">HTML</button>
          <button class="tab" data-lang="css">CSS</button>
          <button class="tab" data-lang="js">JavaScript</button>
        </div>
      </div>

      <div class="editor-wrap">
        <div id="lineNumbers">1</div>
        <textarea id="editor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          aria-label="Code editor"
        ></textarea>
      </div>

      <div class="editor-footer">
        <span id="cursorInfo">Ln 1, Col 1</span>
        <span id="languageInfo">HTML · UTF-8</span>
      </div>
    </section>

    <section class="right">
      <div class="section-head">
        <div class="dot"></div>
        <span>LIVE PREVIEW</span>
        <div class="preview-tools">
          <button data-size="desktop">Desktop</button>
          <button data-size="tablet">Tablet</button>
          <button data-size="mobile">Mobile</button>
        </div>
      </div>

      <div class="preview-area">
        <div class="device desktop" id="device">
          <div class="device-bar">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <span style="margin-left:6px">localhost / preview</span>
          </div>
          <iframe
            id="preview"
            title="WebDev live preview"
            sandbox="allow-scripts allow-forms allow-modals"
          ></iframe>
        </div>
      </div>

      <div class="console">
        <div class="console-head">
          <span>ENGINE CONSOLE</span>
          <button id="clearConsole" style="padding:4px 8px;font-size:10px">
            Clear output
          </button>
        </div>
        <div id="consoleOutput">
          <div class="log">WebDev Engine initialized.</div>
          <div class="log">Ready to execute your project.</div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span>WEBDEV ENGINE <strong>v1.0.0</strong></span>
    <span>HTML · CSS · JS</span>
    <span id="saveStatus">LOCAL WORKSPACE</span>
  </footer>

</div>

<script>
"use strict";

const $ = (selector) => document.querySelector(selector);

const editor = $("#editor");
const preview = $("#preview");
const consoleOutput = $("#consoleOutput");
const lineNumbers = $("#lineNumbers");
const status = $("#status");

const STORAGE_KEY = "webdev-engine-project-v1";

const defaults = {
  html: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebDev Project</title>
</head>
<body>
  <main class="card">
    <div class="eyebrow">WEBDEV ENGINE</div>
    <h1>Build something <span>remarkable.</span></h1>
    <p>Your code. Your ideas. Your website.</p>
    <button id="hello">Test JavaScript</button>
    <div id="result"></div>
  </main>
</body>
</html>`,
  css: `* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #08130e;
  color: #edf7ef;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 600px;
  padding: 48px 32px;
  text-align: center;
}

.eyebrow {
  color: #bba878;
  font-size: 11px;
  letter-spacing: 4px;
}

h1 {
  font-size: clamp(32px, 7vw, 58px);
  line-height: 1.1;
  letter-spacing: -2px;
}

h1 span {
  color: #38d996;
}

p {
  color: #a1b4a7;
  line-height: 1.8;
}

button {
  margin-top: 18px;
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  background: #38d996;
  color: #07110d;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 18px;
  color: #d8bd83;
}`,
  js: `console.log("WebDev Engine is running.");

document.getElementById("hello").addEventListener("click", () => {
  document.getElementById("result").textContent =
    "JavaScript works!";
  console.log("Button clicked successfully.");
});`
};

let files = { ...defaults };
let activeLang = "html";
let runTimer;

function addLog(message, type = "log") {
  const line = document.createElement("div");
  line.className = type;

  // Display messages as text, never as HTML.
  line.textContent = String(message);

  consoleOutput.appendChild(line);
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

function clearConsole() {
  consoleOutput.replaceChildren();
}

function updateLineNumbers() {
  const count = editor.value.split("\n").length;
  lineNumbers.textContent = Array.from(
    { length: count },
    (_, i) => i + 1
  ).join("\n");
  lineNumbers.scrollTop = editor.scrollTop;
}

function updateCursor() {
  const before = editor.value.slice(0, editor.selectionStart);
  const lines = before.split("\n");
  $("#cursorInfo").textContent =
    `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
}

function switchTab(lang) {
  files[activeLang] = editor.value;
  activeLang = lang;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.lang === lang);
  });

  editor.value = files[lang];
  $("#fileLabel").textContent =
    lang === "js" ? "script.js" :
    lang === "css" ? "style.css" : "index.html";

  $("#languageInfo").textContent =
    (lang === "js" ? "JAVASCRIPT" : lang.toUpperCase()) + " · UTF-8";

  updateLineNumbers();
  updateCursor();
  editor.focus();
}

function persistProject() {
  files[activeLang] = editor.value;

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
    $("#saveStatus").textContent = "SAVED LOCALLY";
  } catch (error) {
    $("#saveStatus").textContent = "LOCAL SAVE UNAVAILABLE";
  }
}

function restoreProject() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (saved && typeof saved === "object") {
      for (const lang of ["html", "css", "js"]) {
        if (typeof saved[lang] === "string") {
          files[lang] = saved[lang];
        }
      }
    }
  } catch (error) {
    // Use the default project if saved data is invalid.
  }
}

function buildDocument() {
  files[activeLang] = editor.value;

  const parser = new DOMParser();
  const doc = parser.parseFromString(files.html, "text/html");

  // Add CSS as a stylesheet, keeping the user's HTML structure.
  const style = doc.createElement("style");
  style.textContent = files.css;
  doc.head.appendChild(style);

  // Install console reporting before running the user's JavaScript.
  const bridge = doc.createElement("script");

  bridge.textContent = `
    (() => {
      const send = (type, args) => {
        try {
          parent.postMessage({
            source: "webdev-engine",
            type,
            message: args.map(value => {
              try {
                if (typeof value === "string") return value;
                if (value instanceof Error) return value.message;
                return JSON.stringify(value) ?? String(value);
              } catch (_) {
                return String(value);
              }
            }).join(" ")
          }, "*");
        } catch (_) {}
      };

      for (const method of ["log", "info", "warn", "error"]) {
        const original = console[method].bind(console);
        console[method] = (...args) => {
          original(...args);
          send(method === "error" ? "error" :
               method === "warn" ? "warn" : "log", args);
        };
      }

      window.addEventListener("error", event => {
        send("error", [
          event.message || "Unknown JavaScript error",
          event.lineno ? "Line " + event.lineno : ""
        ]);
      });

      window.addEventListener("unhandledrejection", event => {
        send("error", ["Unhandled promise rejection", event.reason]);
      });
    })();
  `;

  doc.head.prepend(bridge);

  // Put user JavaScript after the HTML has been parsed.
  const userScript = doc.createElement("script");
  userScript.textContent = files.js;
  doc.body.appendChild(userScript);

  return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}

function runCode() {
  files[activeLang] = editor.value;
  persistProject();
  clearConsole();

  status.textContent = "● RUNNING";
  status.style.color = "var(--gold)";

  addLog("Building preview document...");

  try {
    const html = buildDocument();
    preview.srcdoc = html;

    addLog("Document submitted to the browser renderer.");
    addLog("CSS and JavaScript injected.");
    addLog("Preview refreshed.");

    $("#address").value = "webdev://local-preview";
  } catch (error) {
    addLog(error.message, "error");
    status.textContent = "● ERROR";
    status.style.color = "var(--red)";
  }

  clearTimeout(runTimer);
  runTimer = setTimeout(() => {
    status.textContent = "● READY";
    status.style.color = "var(--green)";
  }, 800);
}

function resetProject() {
  if (!confirm("Reset all three files to the starter project?")) return;

  files = { ...defaults };
  switchTab("html");
  persistProject();
  runCode();
}

function exportProject() {
  files[activeLang] = editor.value;

  const html = buildDocument();
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "webdev-project.html";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
  addLog("Exported webdev-project.html");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => switchTab(tab.dataset.lang));
});

document.querySelectorAll("[data-size]").forEach(button => {
  button.addEventListener("click", () => {
    $("#device").className = "device " + button.dataset.size;
  });
});

editor.addEventListener("input", () => {
  files[activeLang] = editor.value;
  updateLineNumbers();
  updateCursor();
  persistProject();

  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 900);
});

editor.addEventListener("scroll", () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener("click", updateCursor);
editor.addEventListener("keyup", updateCursor);

editor.addEventListener("keydown", event => {
  if (event.key === "Tab") {
    event.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    editor.setRangeText("  ", start, end, "end");
    editor.dispatchEvent(new Event("input"));
  }

  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    runCode();
  }
});

$("#runBtn").addEventListener("click", runCode);
$("#refreshBtn").addEventListener("click", runCode);
$("#backBtn").addEventListener("click", resetProject);
$("#clearBtn").addEventListener("click", clearConsole);
$("#clearConsole").addEventListener("click", clearConsole);
$("#exportBtn").addEventListener("click", exportProject);

window.addEventListener("message", event => {
  // Accept messages only from our preview iframe.
  if (event.source !== preview.contentWindow) return;

  const data = event.data;

  if (!data || data.source !== "webdev-engine") return;

  const allowedTypes = {
    log: "log",
    info: "log",
    warn: "warn",
    error: "error"
  };

  const type = allowedTypes[data.type];
  if (!type) return;

  addLog(data.message, type);
});

restoreProject();
switchTab("html");
runCode();
</script>
</body>
</html>
